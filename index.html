    <script>
        // Fonction pour fermer le pop-up et empêcher qu'il réapparaisse
        function closePopup() {
            document.getElementById("popup").style.display = "none";

            // Empêcher l'ouverture future du pop-up (en stockant un flag dans localStorage)
            localStorage.setItem('popupClosed', 'true');
        }

        // Vérifier si le pop-up a déjà été fermé
        if (!localStorage.getItem('popupClosed')) {
            // Si non, afficher le pop-up après 2 secondes (pour simuler un délai)
            setTimeout(function() {
                document.getElementById("popup").style.display = "block";
            }, 2000); // 2000 ms = 2 secondes
        }
    </script>
